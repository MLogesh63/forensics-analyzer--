<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Forensics Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 450px; padding: 20px; }
        .form-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #555; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; transition: border 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        .requirements { background: #f0f4ff; padding: 12px; border-radius: 6px; margin-top: 10px; font-size: 12px; color: #555; }
        .requirements div { margin: 5px 0; }
        .req-check { color: #28a745; }
        .req-uncheck { color: #dc3545; }
        .btn { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.3s; }
        .btn:hover { background: #764ba2; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #667eea; text-decoration: none; font-size: 14px; }
        .link a:hover { text-decoration: underline; }
        .error { background: #ffe8e8; color: #dc3545; padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h1>Reset Password</h1>
            <p class="subtitle">Create a new strong password</p>
            
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            
            <form method="POST">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter new password" required oninput="checkPassword()">
                    <div class="requirements">
                        <div id="len" class="req-uncheck">✗ At least 8 characters</div>
                        <div id="upper" class="req-uncheck">✗ At least 1 uppercase (A-Z)</div>
                        <div id="lower" class="req-uncheck">✗ At least 1 lowercase (a-z)</div>
                        <div id="num" class="req-uncheck">✗ At least 1 number (0-9)</div>
                        <div id="special" class="req-uncheck">✗ At least 1 special character (!@#$%)</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm" name="confirm_password" placeholder="Confirm new password" required oninput="checkMatch()">
                    <small id="match-msg" style="color: #dc3545; display: none;">Passwords do not match</small>
                </div>
                
                <button type="submit" class="btn">Reset Password</button>
            </form>
            
            <div class="link">
                <a href="/login">← Back to Login</a>
            </div>
        </div>
    </div>
    
    <script>
        function checkPassword() {
            const pass = document.getElementById('password').value;
            document.getElementById('len').innerHTML = pass.length >= 8 ? '✓ At least 8 characters' : '✗ At least 8 characters';
            document.getElementById('len').className = pass.length >= 8 ? 'req-check' : 'req-uncheck';
            
            document.getElementById('upper').innerHTML = /[A-Z]/.test(pass) ? '✓ At least 1 uppercase (A-Z)' : '✗ At least 1 uppercase (A-Z)';
            document.getElementById('upper').className = /[A-Z]/.test(pass) ? 'req-check' : 'req-uncheck';
            
            document.getElementById('lower').innerHTML = /[a-z]/.test(pass) ? '✓ At least 1 lowercase (a-z)' : '✗ At least 1 lowercase (a-z)';
            document.getElementById('lower').className = /[a-z]/.test(pass) ? 'req-check' : 'req-uncheck';
            
            document.getElementById('num').innerHTML = /[0-9]/.test(pass) ? '✓ At least 1 number (0-9)' : '✗ At least 1 number (0-9)';
            document.getElementById('num').className = /[0-9]/.test(pass) ? 'req-check' : 'req-uncheck';
            
            document.getElementById('special').innerHTML = /[!@#$%^&*()_+\-=\[\]{};:'",.< >?/\\|`~]/.test(pass) ? '✓ At least 1 special character' : '✗ At least 1 special character';
            document.getElementById('special').className = /[!@#$%^&*()_+\-=\[\]{};:'",.< >?/\\|`~]/.test(pass) ? 'req-check' : 'req-uncheck';
            
            checkMatch();
        }
        
        function checkMatch() {
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const matchMsg = document.getElementById('match-msg');
            if (confirm && pass !== confirm) {
                matchMsg.style.display = 'block';
            } else {
                matchMsg.style.display = 'none';
            }
        }
    </script>
</body>
</html>
